<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEARN WITH FUN 2</title>
</head>
<body>
    <body style="background-color:#212121;color: #fff;">
   <ul class="lang">
    <li>javascript</li>
   </ul>
</body>
<script>
    function addlang(lname) {
        const li=document.createElement('li')
        li.innerHTML=`${lname}`
        document.querySelector('.lang').appendChild(li)
    }
    addlang('python')
    addlang('java')

    function addopt(lname) {
         const li=document.createElement('li')
        li.appendChild(document.createTextNode(lname))
        document.querySelector('.lang').appendChild(li)
    
    }
    addopt('c++')

    //edit
const secl= document.querySelector('li:nth-child(2)')
//secl.innerHTML="mojo"
const newli=document.createElement('li')
newli.textContent="mojo"
secl.replaceWith(newli)
//edit
const firl=document.querySelector('li:first-child')
firl.outerHTML='<li>typescript</li>'

//remove
const lastl=document.querySelector('li:last-child')
lastl.remove()

</script>
</html>
